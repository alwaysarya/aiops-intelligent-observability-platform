# 1. PostgreSQL Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aiops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "aiops"
        - name: POSTGRES_PASSWORD
          value: "aiops_password"
        - name: POSTGRES_DB
          value: "aiops"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aiops
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# 2. Log Ingestion Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestion
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-ingestion
  template:
    metadata:
      labels:
        app: log-ingestion
    spec:
      containers:
      - name: log-ingestion
        image: aiops-log-ingestion:latest
        imagePullPolicy: Never # For local minikube
        env:
        - name: DATABASE_URL
          value: "postgresql://aiops:aiops_password@postgres:5432/aiops"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: log-ingestion
  namespace: aiops
spec:
  selector:
    app: log-ingestion
  ports:
  - port: 8000
    targetPort: 8000

---
# 3. API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: aiops-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aiops
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
