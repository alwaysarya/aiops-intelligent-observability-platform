name: AIOps Platform CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Test Frontend
  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

  # Job 2: Test Backend Services
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [log-ingestion-service, ai-anomaly-detector, alert-service, root-cause-analyzer]
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: ./services/${{ matrix.service }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      working-directory: ./services/${{ matrix.service }}
      run: |
        pip install flake8
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

  # Job 3: Build Docker Images (Only on main branch push)
  docker-build:
    needs: [frontend-test, backend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Log Ingestion Image
      run: docker build -t aiops-log-ingestion:latest ./services/log-ingestion-service
        
    - name: Build Anomaly Detector Image
      run: docker build -t aiops-anomaly-detector:latest ./services/ai-anomaly-detector
        
    - name: Build Alert Service Image
      run: docker build -t aiops-alert-service:latest ./services/alert-service
        
    - name: Build RCA Image
      run: docker build -t aiops-rca:latest ./services/root-cause-analyzer
