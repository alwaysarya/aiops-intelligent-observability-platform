version: "3.9"

networks:
  aiops-network:
    external: true
    name: log-ingestion-service_aiops-network

services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aiops-api-gateway
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
    networks:
      - aiops-network
    restart: unless-stopped
