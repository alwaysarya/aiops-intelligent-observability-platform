networks:
  aiops-network:
    name: log-ingestion-service_aiops-network
    external: true

services:
  # ==========================================
  # DATABASE LAYER
  # ==========================================
  
  # 1. Master Database (Handles Writes)
  postgres-master:
    image: postgres:15-alpine
    container_name: aiops-postgres-master
    environment:
      POSTGRES_USER: aiops_user
      POSTGRES_PASSWORD: aiops_password
      POSTGRES_DB: aiops_db
      # Replication settings for Read Replica
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c max_replication_slots=10
               -c hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    networks:
      - aiops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_user -d aiops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Read Replica Database (Handles Reads)
  postgres-replica:
    image: postgres:15-alpine
    container_name: aiops-postgres-replica
    environment:
      POSTGRES_USER: aiops_user
      POSTGRES_PASSWORD: aiops_password
      PGUSER: aiops_user
      PGPASSWORD: aiops_password
    depends_on:
      - postgres-master
    ports:
      - "5433:5432"
    networks:
      - aiops-network
    restart: unless-stopped

  # 3. PgBouncer (Connection Pooler)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: aiops-pgbouncer
    environment:
      - DB_USER=aiops_user
      - DB_PASSWORD=aiops_password
      - DB_HOST=postgres-master
      - DB_NAME=aiops_db
      - POOL_MODE=transaction
      - AUTH_TYPE=trust
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    ports:
      - "6432:5432"
    depends_on:
      - postgres-master
    networks:
      - aiops-network
    restart: unless-stopped

  # ==========================================
  # MICROSERVICES
  # ==========================================


  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    ports:
      - "6379:6379"
    networks:
      - aiops-network
    restart: unless-stopped


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aiops-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - aiops-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aiops-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - aiops-network
    restart: unless-stopped


  neo4j:
    image: neo4j:5.15.0
    container_name: aiops-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/aiops_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    networks:
      - aiops-network
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    container_name: aiops-frontend
    ports:
      - "3000:80"
    networks:
      - aiops-network
    depends_on:
      - api-gateway
    restart: unless-stopped


  n8n:
    image: n8nio/n8n
    container_name: aiops-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - aiops-network
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    container_name: aiops-api-gateway
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      # Connecting to PgBouncer for pooling
      - DATABASE_URL=postgresql://aiops_user:aiops_password@pgbouncer:5432/aiops_db
      - READ_REPLICA_URL=postgresql://aiops_user:aiops_password@postgres-replica:5432/aiops_db
    networks:
      - aiops-network
    depends_on:
      - pgbouncer
      - postgres-replica
    restart: unless-stopped

  log-ingestion-service:
    build: ./services/log-ingestion-service
    container_name: aiops-log-ingestion
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - REDIS_HOST=redis
    networks:
      - aiops-network
    depends_on:
      - postgres-master
      - elasticsearch
    restart: unless-stopped

  anomaly-detector:
    build:
      context: ./services/ai-anomaly-detector
    container_name: aiops-anomaly-detector
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MODEL_DIR=/app/models
    networks:
      - aiops-network
    restart: unless-stopped

  alert-service:
    build:
      context: ./services/alert-service
    container_name: aiops-alert-service
    ports:
      - "8002:8002"
    networks:
      - aiops-network
    restart: unless-stopped

  root-cause-analyzer:
    build:
      context: ./services/root-cause-analyzer
    container_name: aiops-root-cause-analyzer
    ports:
      - "8003:8003"
    networks:
      - aiops-network
    restart: unless-stopped


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: aiops-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - aiops-network
    restart: unless-stopped

volumes:
  es_data:

  postgres_master_data:
  neo4j_data:
  n8n_data:
