networks:
  aiops-network:
    external: true
    name: log-ingestion-service_aiops-network

services:
  alert-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops-alert-service
    hostname: alert-service
    ports:
      - "8002:8002"
      - "9092:9090"
    environment:
      - APP_NAME=alert-service
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=false
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8002
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_ANOMALIES=aiops.anomalies
      - KAFKA_CONSUMER_GROUP=alert-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=1
      - DEDUP_WINDOW_SECONDS=300
      - SLACK_ENABLED=false
      - EMAIL_ENABLED=false
      - WEBHOOK_ENABLED=false
      - MIN_SEVERITY_TO_ALERT=medium
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=alert-service
    networks:
      - aiops-network
    restart: unless-stopped
